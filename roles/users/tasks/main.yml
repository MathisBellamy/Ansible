---

- name: "USERS - Create groups"
  ansible.builtin.group:
    name: "{{ item['name'] }}"
    state: 'present'
  loop: "{{ _users_groups_list }}"
  become: true

- name: "USERS - Create groups sudoers file"
  ansible.builtin.template:
    src: 'etc/sudoers.d/sudoers.j2'
    dest: "/etc/sudoers.d/{{ item['name'] }}"
    owner: root
    group: root
    mode: "0o440"
  loop: "{{ _users_groups_list }}"
  become: true

- name: "USERS - Create users"
  ansible.builtin.user:
    name: "{{ item['name'] }}"
    password: "{{ item['password'] | password_hash('sha512') }}"
    groups: "{{ item['groups'] | join(',') }}"
    shell: "/bin/bash"
  loop: "{{ _users_users_list }}"
  become: true

- name: "USERS - Ensure .ssh directory exists"
  ansible.builtin.file:
    path: "/home/{{ item['name'] }}/.ssh"
    owner: "{{ item['name'] }}"
    group: "{{ item['name'] }}"
    mode: "0o700"
    state: directory
  loop: "{{ _users_users_list }}"
  become: true

- name: "USERS - Deposit ssh key"
  ansible.posix.authorized_key:
    user: "{{ item['name'] }}"
    state: "present"
    key: "{{ lookup('file', './files/ssh_keys/' ~ item['name'] ~ '.pub') }}"
    path: "/home/{{ item['name'] }}/.ssh/authorized_keys"
    manage_dir: false
  loop: "{{ _users_users_list }}"
  when: item['ssh_key']
